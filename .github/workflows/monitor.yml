name: allcpp status monitor

on:
  schedule:
    # 每 10 分钟查一次（UTC 时间，错开整点）；只有审核结果出来才推送
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "同时发一条测试消息，验证推送是否通畅"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: allcpp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 检查摊位状态
        env:
          ALLCPP_COOKIE: ${{ secrets.ALLCPP_COOKIE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -f check_status.py ]; then
            echo "使用根目录脚本"; python3 check_status.py
          else
            echo "使用 .github 目录脚本"; python3 .github/check_status.py
          fi

      - name: 发送测试消息（仅手动触发时）
        if: inputs.test_notify
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -n "$WECOM_WEBHOOK" ]; then
            RESP=$(curl -s -X POST "$WECOM_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"msgtype":"markdown","markdown":{"content":"**allcpp 监控**\n> 推送通道测试成功，状态有变化会在这里提醒你"}}')
            echo "企业微信返回: $RESP"
            case "$RESP" in
              *'"errcode":0'*) echo "推送成功" ;;
              *) echo "::error::推送失败，检查 WECOM_WEBHOOK 是否正确"; exit 1 ;;
            esac
          elif [ -n "$SERVERCHAN_KEY" ]; then
            RESP=$(curl -s -X POST "https://sctapi.ftqq.com/$SERVERCHAN_KEY.send" \
              --data-urlencode "title=allcpp 监控推送测试" \
              --data-urlencode "desp=推送通道正常，状态有变化会在这里提醒你")
            echo "Server酱返回: $RESP"
          else
            echo "::error::未配置任何推送通道，请在 Secrets 里添加 WECOM_WEBHOOK 或 SERVERCHAN_KEY"
            exit 1
          fi

      - name: 保存状态快照
        run: |
          FILES=""
          for f in state.json .github/state.json last_run.json .github/last_run.json; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          if [ -z "$FILES" ]; then echo "没有需要保存的文件"; exit 0; fi
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: update state"
            git push
          else
            echo "没有变化，不需要提交"
          fi
