name: allcpp status monitor

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC 时间，每 10 分钟一次
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: allcpp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 检查摊位状态
        env:
          ALLCPP_COOKIE: ${{ secrets.ALLCPP_COOKIE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python3 check_status.py

      - name: 保存状态快照
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update state"
            git push
          else
            echo "state.json 无变化"
          fi
