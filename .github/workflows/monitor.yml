name: allcpp status monitor

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC 时间，每 10 分钟一次
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "同时发一条测试消息，验证推送是否通畅"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: allcpp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 检查摊位状态
        env:
          ALLCPP_COOKIE: ${{ secrets.ALLCPP_COOKIE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -f check_status.py ]; then
            echo "使用根目录脚本"; python3 check_status.py
          else
            echo "使用 .github 目录脚本"; python3 .github/check_status.py
          fi

      - name: 发送测试消息（仅手动触发时）
        if: inputs.test_notify
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -n "$WECOM_WEBHOOK" ]; then
            curl -s -X POST "$WECOM_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"msgtype":"markdown","markdown":{"content":"**allcpp 监控**\n> 推送通道测试成功，状态有变化会在这里提醒你"}}'
          elif [ -n "$SERVERCHAN_KEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/$SERVERCHAN_KEY.send" \
              --data-urlencode "title=allcpp 监控推送测试" \
              --data-urlencode "desp=推送通道正常，状态有变化会在这里提醒你"
          else
            echo "未配置任何推送通道，请检查 Secrets"
          fi

      - name: 保存状态快照
        run: |
          if [ -f state.json ] || [ -f .github/state.json ]; then
            FILES=""
            [ -f state.json ] && FILES="$FILES state.json"
            [ -f .github/state.json ] && FILES="$FILES .github/state.json"
            if [ -n "$(git status --porcelain $FILES)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add $FILES
              git commit -m "chore: update state"
              git push
            else
              echo "state 无变化"
            fi
          else
            echo "没有找到 state 文件"
          fi
